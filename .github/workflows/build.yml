name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      #################### BUILD ####################
      - name: Clone SSG
        run: git clone https://github.com/travis-heavener/stylus.git generator

      - name: Make Static Files
        run: |
          mkdir text-components
          python3 generator/src/main.py -f --config config.stylus.json

      #################### MINIFY ####################
      - name: Minify
        run: |
          npm i -g html-minifier-terser lightningcss terser
          for f in ./public/**/*.js; do npx terser "$f" -c -m -o "$f"; done
          find ./public -name "*.css" -exec sh -c 'npx lightningcss-cli --minify "$1" --output-dir "$(dirname "$1")"' _ {} \;
          npx html-minifier-terser --input-dir ./public --output-dir ./public --file-ext html --collapse-whitespace --remove-comments --minify-js true --minify-css true --process-scripts "application/ld+json"

      #################### VALIDATE ####################
      - name: W3 Validate HTML
        uses: anishathalye/proof-html@v2
        with:
          directory: ./public/
          enforce_https: false
          disable_external: true
          check_css: false
          ignore_empty_alt: true

      #################### UPLOAD ####################
      - name: Upload Pages Artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  Deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: Build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v5
