<!DOCTYPE HTML>
<html lang="en">
    <head>
        <$ SharedMetaTags />

        <link rel="canonical" href="https://wowtravis.com/bio/">
        <meta property="og:url" content="https://wowtravis.com/bio/">
        <meta name="description" content="Meet Travis Heavener, an ITWS student at RPI, dedicated full-stack developer and experienced programmer passionate about technology and collaboration.">
        <meta property="og:title" content="About - Travis Heavener">
        <meta property="og:description" content="Meet Travis Heavener, an ITWS student at RPI, dedicated full-stack developer and experienced programmer passionate about technology and collaboration.">

        <title>About - Travis Heavener</title>

        <link rel="stylesheet" $stylus-cache-bust-href="index.css">

        <!-- WebSchema for SEO/GEO -->
        <$ Schema.Bio />
    </head>
    <body id="top">
        <a href="#main-content" class="skip-link">Skip to main content</a>
        <$ Header />
        <main id="main-content">
            <header class="page-heading">
                <h1>About</h1>
                <$ Dots />
            </header>

            <section class="bio-panel bio-panel--intro" aria-labelledby="about-intro">
                <div class="bio-copy">
                    <div class="section-heading">
                        <span class="section-number" aria-hidden="true">01</span>
                        <h2 id="about-intro">Introduction</h2>
                    </div>
                    <$ Bio.Paragraph1 />
                </div>

                <figure class="bio-portrait">
                    <picture>
                        <source media="(max-width: 389px)" srcset="/res/bio/bio-1/280-431.webp?v=2 1x, /res/bio/bio-1/500-769.webp?v=2 2x">
                        <source media="(max-width: 1919px)" srcset="/res/bio/bio-1/280-431.webp?v=2 1x, /res/bio/bio-1/500-769.webp?v=2 2x">
                        <source media="(max-width: 2559px)" srcset="/res/bio/bio-1/380-585.webp?v=2 1x, /res/bio/bio-1/500-769.webp?v=2 2x, /res/bio/bio-1/1000-1538.webp?v=2 4x">
                        <source media="(max-width: 5599px)" srcset="/res/bio/bio-1/500-769.webp?v=2 1x, /res/bio/bio-1/1000-1538.webp?v=2 2x">
                        <source media="(min-width: 5600px)" srcset="/res/bio/bio-1/1000-1538.webp?v=2">
                        <img class="bio-img" src="/res/bio/bio-1/1000-1538.webp?v=2" alt="Travis Heavener in a black tux and tie" loading="lazy" decoding="async">
                    </picture>
                    <figcaption>Travis Heavener</figcaption>
                </figure>
            </section>

            <section class="bio-panel bio-panel--experience" aria-labelledby="about-experience">
                <figure class="bio-portrait bio-portrait--secondary">
                    <picture>
                        <source media="(max-width: 389px)" srcset="/res/bio/bio-2/280-431.webp?v=2 1x, /res/bio/bio-2/500-769.webp?v=2 2x">
                        <source media="(max-width: 1919px)" srcset="/res/bio/bio-2/280-431.webp?v=2 1x, /res/bio/bio-2/500-769.webp?v=2 2x">
                        <source media="(max-width: 2559px)" srcset="/res/bio/bio-2/380-585.webp?v=2 1x, /res/bio/bio-2/500-769.webp?v=2 2x, /res/bio/bio-2/1000-1538.webp?v=2 4x">
                        <source media="(max-width: 5599px)" srcset="/res/bio/bio-2/500-769.webp?v=2 1x, /res/bio/bio-2/1000-1538.webp?v=2 2x">
                        <source media="(min-width: 5600px)" srcset="/res/bio/bio-2/1000-1538.webp?v=2">
                        <img class="bio-img" src="/res/bio/bio-2/1000-1538.webp?v=2" alt="Travis Heavener smiling in a white polo and green sweater" decoding="async">
                    </picture>
                    <figcaption>Travis Heavener</figcaption>
                </figure>

                <div class="bio-copy">
                    <div class="section-heading">
                        <span class="section-number" aria-hidden="true">02</span>
                        <h2 id="about-experience">Projects &amp; Experience</h2>
                    </div>
                    <$ Bio.Paragraph2 />
                </div>
            </section>
        </main>
        <$ Footer />
    </body>
</html>
